<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ФОРУМ ОСБ ДПС — КУЗБАСС</title>
    
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        :root { --blue: #007bff; --bg: #0a0c10; --card: #12161c; --glow: 0 0 15px rgba(0, 123, 255, 0.4); }
        body { background: var(--bg); color: #ccc; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        /* ШАПКА КАК ТЫ ХОТЕЛ */
        header { 
            width: 100%; 
            height: 450px; 
            background: linear-gradient(to bottom, rgba(10, 12, 16, 0) 50%, var(--bg) 100%), 
                        url('i.png') no-repeat center center; 
            background-size: cover; 
            border-bottom: 2px solid var(--blue); 
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.2);
        }

        .container { max-width: 900px; margin: -100px auto 50px; position: relative; z-index: 10; padding: 0 20px; }
        .card { background: var(--card); border: 1px solid #232a35; border-radius: 8px; padding: 35px; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); text-align: center; }
        
        .btn { background: transparent; border: 1px solid var(--blue); color: var(--blue); padding: 10px 25px; cursor: pointer; text-transform: uppercase; font-weight: bold; border-radius: 4px; transition: 0.3s; }
        .btn:hover { background: var(--blue); color: #fff; box-shadow: var(--glow); }
        
        input, textarea { background: #000; border: 1px solid #222; color: #fff; padding: 12px; margin-bottom: 12px; width: 100%; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        
        .status-box { font-size: 40px; font-weight: 900; text-transform: uppercase; margin: 25px 0; letter-spacing: 4px; }
        .st-pending { color: #fff; text-shadow: 0 0 10px #fff; }
        .st-review { color: #ffff00; text-shadow: 0 0 10px #ffff00; }
        .st-approved { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
        .st-rejected { color: #ff0000; text-shadow: 0 0 10px #ff0000; }

        #auth-v, #reg-v, #status-v, #main-v, #raports-v { display: none; }
        .active { display: block !important; }
        
        .forum-link { border-bottom: 1px solid #222; padding: 18px; display: flex; align-items: center; text-align: left; cursor: pointer; }
        .forum-link:hover { background: #181d26; border-left: 3px solid var(--blue); }
    </style>
</head>
<body>

<header></header>

<div class="container">
    <!-- ВХОД -->
    <div id="auth-v" class="card active">
        <h2 style="color: #fff; letter-spacing: 2px;">АВТОРИЗАЦИЯ</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="pass" placeholder="Пароль">
        <br><br>
        <button class="btn" onclick="login()">Войти</button>
        <button class="btn" style="border:none; text-decoration: underline; font-size: 13px;" onclick="showPage('reg-v')">Подать рапорт на вступление</button>
    </div>

    <!-- РЕГИСТРАЦИЯ -->
    <div id="reg-v" class="card">
        <h2 style="color: #fff;">АНКЕТА</h2>
        <input type="text" id="r-name" placeholder="ФИО (Пример: Иванов Иван Иванович)">
        <input type="text" id="r-rank" placeholder="Звание (Пример: Рядовой)">
        <input type="text" id="r-post" placeholder="Должность (Пример: Инспектор)">
        <input type="email" id="r-email" placeholder="Email для входа">
        <input type="password" id="r-pass" placeholder="Пароль">
        <button class="btn" onclick="register()">Отправить</button>
        <button class="btn" style="border:none;" onclick="showPage('auth-v')">Назад</button>
    </div>

    <!-- СТАТУС -->
    <div id="status-v" class="card">
        <h2 style="color: #666;">СТАТУС ДОСТУПА:</h2>
        <div id="st-text" class="status-box"></div>
        <p id="st-desc" style="color: #555;"></p>
        <button class="btn" onclick="logout()">Выйти</button>
    </div>

    <!-- ФОРУМ -->
    <div id="main-v">
        <div class="card" style="display: flex; justify-content: space-between; align-items: center; padding: 20px 30px;">
            <div style="text-align: left;">
                <div id="u-info" style="color: var(--blue); font-size: 11px; font-weight: bold;"></div>
                <h3 id="u-display" style="margin:0; color:#fff;"></h3>
            </div>
            <button class="btn" onclick="logout()">Выход</button>
        </div>
        <div class="card" style="padding: 0; overflow: hidden;">
            <div class="forum-link" onclick="openRaports()">📈 <div><b style="color:#fff; display:block;">Рапорты на повышение</b><span style="color:#555; font-size:12px;">Отчеты личного состава.</span></div></div>
            <div class="forum-link">📜 <div><b style="color:#fff; display:block;">Канцелярия</b><span style="color:#555; font-size:12px;">Приказы руководства.</span></div></div>
        </div>
    </div>

    <!-- РАПОРТЫ -->
    <div id="raports-v">
        <div class="card">
            <button class="btn" onclick="showPage('main-v')" style="float:left; padding:5px 10px;">←</button>
            <h2 style="color: #fff;">РАПОРТЫ</h2>
            <textarea id="rep-txt" rows="4" style="margin-top:20px;" placeholder="Суть рапорта..."></textarea>
            <button class="btn" onclick="sendRep()">Отправить</button>
        </div>
        <div id="reps-list"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAwTtQdXUORxEMwxYb5-6UQxD0ilYOaevg",
        authDomain: "://firebaseapp.com",
        projectId: "osbforum",
        storageBucket: "osbforum.firebasestorage.app",
        messagingSenderId: "126019468718",
        appId: "1:126019468718:web:8a729fc6d5df476f7d1c3f"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let userData = null;

    auth.onAuthStateChanged(user => {
        if (user) {
            db.collection('users').doc(user.uid).onSnapshot(doc => {
                if (doc.exists) {
                    userData = doc.data();
                    if (userData.status === 'approved') {
                        document.getElementById('u-info').innerText = `${userData.rank} | ${userData.post}`;
                        document.getElementById('u-display').innerText = userData.name;
                        showPage('main-v');
                    } else { updateUI(userData.status); showPage('status-v'); }
                }
            });
        } else { showPage('auth-v'); }
    });

    function updateUI(status) {
        const t = document.getElementById('st-text');
        const d = document.getElementById('st-desc');
        t.className = 'status-box';
        if (status === 'pending') { t.innerText = 'ОЖИДАНИЕ'; t.classList.add('st-pending'); d.innerText = 'Ваш рапорт в очереди.'; }
        else if (status === 'review') { t.innerText = 'НА ПРОВЕРКЕ'; t.classList.add('st-review'); d.innerText = 'Руководство изучает анкету.'; }
        else if (status === 'rejected') { t.innerText = 'ОТКАЗАНО'; t.classList.add('st-rejected'); d.innerText = 'Рапорт отклонен.'; }
    }

    function register() {
        const n = document.getElementById('r-name').value, r = document.getElementById('r-rank').value, 
              p = document.getElementById('r-post').value, e = document.getElementById('r-email').value, 
              ps = document.getElementById('r-pass').value;
        if(!n || !r || !p || !e || !ps) return alert("Заполните всё!");
        auth.createUserWithEmailAndPassword(e, ps).then(res => {
            db.collection('users').doc(res.user.uid).set({ name: n, rank: r, post: p, email: e, status: 'pending' });
        }).catch(err => alert(err.message));
    }

    function openRaports() {
        showPage('raports-v');
        db.collection('reports').orderBy('time', 'desc').onSnapshot(snap => {
            const list = document.getElementById('reps-list'); list.innerHTML = '';
            snap.forEach(doc => {
                const data = doc.data();
                list.innerHTML += `<div class="post card">
                    <div style="font-size:11px; color:#555; float:right;">${new Date(data.time).toLocaleString()}</div>
                    <div style="color:var(--blue); font-weight:bold; font-size:12px;">${data.authorRank}</div>
                    <div style="color:#fff; margin-bottom:10px; font-weight:bold;">${data.authorName}</div>
                    <div style="white-space:pre-wrap; color:#bbb;">${data.text}</div>
                </div>`;
            });
        });
    }

    function sendRep() {
        const val = document.getElementById('rep-txt').value;
        if (!val) return;
        db.collection('reports').add({ text: val, authorName: userData.name, authorRank: userData.rank, time: Date.now() })
        .then(() => { document.getElementById('rep-txt').value = ''; });
    }

    function showPage(id) {
        document.querySelectorAll('.container > div').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
    function login() { auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('pass').value); }
    function logout() { auth.signOut().then(() => location.reload()); }
</script>
</body>
</html>
