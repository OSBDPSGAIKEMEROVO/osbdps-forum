<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ФОРУМ ОСБ ДПС — КУЗБАСС</title>
    
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        :root { --blue: #007bff; --bg: #0a0c10; --card: #12161c; }
        body { background: var(--bg); color: #ccc; font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        header { 
            width: 100%; height: 280px; 
            background: url('i.png') no-repeat center center; background-size: cover; 
            border-bottom: 3px solid var(--blue); box-shadow: 0 0-15px rgba(0, 123, 255, 0.4);
        }

        .container { max-width: 800px; margin: -30px auto 50px; padding: 0 20px; }
        .card { background: var(--card); border: 1px solid #232a35; border-radius: 8px; padding: 35px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        .btn { 
            background: transparent; border: 1px solid var(--blue); color: var(--blue); 
            padding: 12px 30px; cursor: pointer; text-transform: uppercase; font-weight: bold; border-radius: 4px; transition: 0.3s; width: 100%; max-width: 300px;
        }
        .btn:hover { background: var(--blue); color: #fff; box-shadow: 0 0 15px var(--blue); }
        .btn-text { background: none; border: none; color: #666; cursor: pointer; text-decoration: underline; margin-top: 15px; font-size: 14px; }

        input { 
            background: #000; border: 1px solid #333; color: #fff; padding: 12px; 
            margin-bottom: 15px; width: 100%; max-width: 350px; border-radius: 4px; box-sizing: border-box;
            outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--blue); box-shadow: 0 0 5px var(--blue); }
        
        .status-box { font-size: 45px; font-weight: 900; text-transform: uppercase; letter-spacing: 5px; margin: 30px 0; }
        .st-pending { color: #ffffff; text-shadow: 0 0 10px #fff; }
        .st-review { color: #ffff00; text-shadow: 0 0 10px #ffff00; }
        .st-approved { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
        .st-rejected { color: #ff0000; text-shadow: 0 0 10px #ff0000; }

        #auth-view, #reg-view, #status-view, #forum-view { display: none; text-align: center; }
        .active { display: block !important; }

        .forum-item { border-bottom: 1px solid #222; padding: 20px; display: flex; align-items: center; text-align: left; transition: 0.2s; cursor: pointer; }
        .forum-item:hover { background: #181d26; border-left: 3px solid var(--blue); }
    </style>
</head>
<body>

<header></header>

<div class="container">
    <!-- ВХОД -->
    <div id="auth-view" class="card active">
        <h2 style="color: #fff;">АВТОРИЗАЦИЯ ОСБ</h2>
        <input type="email" id="login-email" placeholder="Email"><br>
        <input type="password" id="login-pass" placeholder="Пароль"><br>
        <button class="btn" onclick="login()">Войти</button><br>
        <button class="btn-text" onclick="showView('reg-view')">Подать рапорт на вступление</button>
    </div>

    <!-- РЕГИСТРАЦИЯ (РАСШИРЕННАЯ АНКЕТА) -->
    <div id="reg-view" class="card">
        <h2 style="color: #fff;">АНКЕТА СОТРУДНИКА</h2>
        <input type="text" id="reg-name" placeholder="ФИО (Пример: Русаков А.Ш.)"><br>
        <input type="text" id="reg-rank" placeholder="Звание (Пример: Майор)"><br>
        <input type="text" id="reg-post" placeholder="Должность (Пример: Начальник ОСБ)"><br>
        <input type="text" id="reg-callsign" placeholder="Позывной (если есть)"><br>
        <div style="border-top: 1px solid #333; margin: 10px 0; padding-top: 15px;"></div>
        <input type="email" id="reg-email" placeholder="Email (для входа)"><br>
        <input type="password" id="reg-pass" placeholder="Пароль"><br>
        <button class="btn" onclick="register()">Отправить рапорт</button><br>
        <button class="btn-text" onclick="showView('auth-view')">Назад</button>
    </div>

    <!-- СТАТУС -->
    <div id="status-view" class="card">
        <h2 style="color: #666; font-size: 18px;">ТЕКУЩИЙ СТАТУС:</h2>
        <div id="status-text" class="status-box">ЗАГРУЗКА...</div>
        <p id="status-desc" style="color: #555;"></p>
        <button class="btn" onclick="logout()" style="margin-top: 20px;">Выйти</button>
    </div>

    <!-- ФОРУМ -->
    <div id="forum-view">
        <div class="card" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 25px;">
            <div style="text-align: left;">
                <div id="user-rank-post" style="color: var(--blue); font-size: 12px; font-weight: bold; text-transform: uppercase;">Загрузка...</div>
                <h3 id="user-display" style="margin: 0; color: #fff;">Сотрудник ОСБ</h3>
            </div>
            <button class="btn" onclick="logout()" style="padding: 5px 15px; width: auto;">Выйти</button>
        </div>

        <div class="card" style="padding: 0; overflow: hidden;">
            <div style="background: #1a1f26; padding: 15px 20px; color: var(--blue); font-weight: bold; border-bottom: 1px solid var(--blue);">ИНФОРМАЦИОННЫЙ РАЗДЕЛ</div>
            <div class="forum-item">📜 <div><b style="color:#fff; display:block;">Канцелярия</b><span style="color:#555; font-size:13px;">Приказы, распоряжения и выговоры.</span></div></div>
            <div class="forum-item">👮 <div><b style="color:#fff; display:block;">Личный состав</b><span style="color:#555; font-size:13px;">Рапорты на повышение и списки сотрудников.</span></div></div>
            <div class="forum-item">📟 <div><b style="color:#fff; display:block;">Дежурная часть</b><span style="color:#555; font-size:13px;">Оперативные сводки и ориентировки.</span></div></div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAwTtQdXUORxEMwxYb5-6UQxD0ilYOaevg",
        authDomain: "://firebaseapp.com",
        projectId: "osbforum",
        storageBucket: "osbforum.firebasestorage.app",
        messagingSenderId: "126019468718",
        appId: "1:126019468718:web:8a729fc6d5df476f7d1c3f"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        if (user) checkStatus(user);
        else showView('auth-view');
    });

    function checkStatus(user) {
        db.collection('users').doc(user.uid).onSnapshot(doc => {
            if (!doc.exists) return;
            const data = doc.data();
            if (data.status === 'approved') {
                document.getElementById('user-rank-post').innerText = `${data.rank || 'Сотрудник'} | ${data.post || 'ОСБ'}`;
                document.getElementById('user-display').innerText = `${data.name} [${data.callsign || 'НЕТ'}]`;
                showView('forum-view');
            } else {
                updateStatusUI(data.status);
                showView('status-view');
            }
        });
    }

    function updateStatusUI(status) {
        const s = document.getElementById('status-text');
        const d = document.getElementById('status-desc');
        s.className = 'status-box';
        if (status === 'pending') { s.innerText = 'ОЖИДАНИЕ'; s.classList.add('st-pending'); d.innerText = 'Ваш рапорт находится в очереди на рассмотрение.'; }
        else if (status === 'review') { s.innerText = 'НА ПРОВЕРКЕ'; s.classList.add('st-review'); d.innerText = 'Руководство батальона изучает ваши личные данные.'; }
        else if (status === 'rejected') { s.innerText = 'ОТКАЗАНО'; s.classList.add('st-rejected'); d.innerText = 'Ваш рапорт на вступление был отклонен.'; }
    }

    function showView(id) {
        document.querySelectorAll('.container > div').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function register() {
        const n = document.getElementById('reg-name').value;
        const r = document.getElementById('reg-rank').value;
        const o = document.getElementById('reg-post').value;
        const c = document.getElementById('reg-callsign').value;
        const e = document.getElementById('reg-email').value;
        const p = document.getElementById('reg-pass').value;

        if (!n || !r || !o || !e || !p) return alert("Заполните все обязательные поля!");

        auth.createUserWithEmailAndPassword(e, p).then(res => {
            db.collection('users').doc(res.user.uid).set({
                name: n, rank: r, post: o, callsign: c, email: e, status: 'pending', role: 'user'
            });
        }).catch(err => alert(err.message));
    }

    function login() {
        auth.signInWithEmailAndPassword(document.getElementById('login-email').value, document.getElementById('login-pass').value).catch(err => alert("Ошибка доступа!"));
    }
    function logout() { auth.signOut().then(() => location.reload()); }
</script>
</body>
</html>
