<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База Данных ОСБ ДПС ГАИ Кузбасс</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        @import url('https://googleapis.com');
        body { background: #050505; color: #e5e5e5; font-family: 'Inter', sans-serif; }
        .mvd-card { background: rgba(15, 15, 15, 0.98); border: 1px solid #222; border-radius: 12px; }
        .input-mvd { background: #111; border: 1px solid #333; padding: 12px; border-radius: 6px; width: 100%; outline: none; transition: 0.3s; color: white; font-size: 14px; }
        .input-mvd:focus { border-color: #1d4ed8; background: #161616; }
        .status-badge { font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
        .waiting { color: #facc15; border: 1px solid #facc15; background: rgba(250, 204, 21, 0.1); }
        .header-bg { background: linear-gradient(0deg, #050505 0%, rgba(5,5,5,0.4) 100%), url('i.png'); background-size: cover; background-position: center; }
    </style>
</head>
<body>

    <!-- Навигация -->
    <nav class="fixed w-full z-50 p-4 flex justify-between items-center bg-black/90 backdrop-blur-md border-b border-white/5">
        <div class="flex items-center gap-3 font-black uppercase tracking-tighter italic text-sm md:text-base">
            <img src="https://postimg.cc" class="w-8 h-8">
            <span>ОСБ <span class="text-blue-600">ДПС</span> ГАИ Кузбасс</span>
        </div>
        <div id="authArea">
            <button onclick="login()" class="bg-[#5865F2] hover:bg-[#4752C4] px-5 py-2 rounded text-[10px] font-black transition-all active:scale-95 uppercase">Вход через Discord</button>
        </div>
    </nav>

    <!-- Шапка с твоей обложкой i.png -->
    <header class="header-bg h-[400px] flex items-center justify-center relative">
        <div class="text-center z-10 px-4">
            <h1 class="text-5xl md:text-7xl font-black italic uppercase tracking-tighter text-white drop-shadow-2xl">FORUM <span class="text-blue-700">OSB</span></h1>
            <p class="text-[10px] text-gray-400 mt-2 tracking-[0.4em] font-bold uppercase">ОСБ ДПС ГАИ ГУ МВД ПО КЕМЕРОВСКОЙ ОБЛАСТИ</p>
        </div>
    </header>

    <!-- Регистрация IC-данных -->
    <div id="regModal" class="hidden fixed inset-0 z-[100] bg-black/95 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="mvd-card max-w-lg w-full p-8 shadow-2xl border-blue-900/40">
            <h2 class="text-2xl font-black italic uppercase tracking-tighter mb-1 text-blue-500 text-center">Личное дело сотрудника</h2>
            <p class="text-[9px] text-gray-500 mb-6 uppercase tracking-widest text-center border-b border-gray-900 pb-4 italic">Внесите IC данные вашего персонажа</p>
            <form id="regForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="icFirst" placeholder="Имя (IC)" class="input-mvd" required>
                    <input type="text" id="icLast" placeholder="Фамилия (IC)" class="input-mvd" required>
                </div>
                <input type="text" id="icBadge" placeholder="Номер жетона (Напр: 42-01)" class="input-mvd" required>
                <select id="icRank" class="input-mvd">
                    <option>Рядовой полиции</option><option>Сержант полиции</option><option>Лейтенант</option><option>Капитан</option><option>Майор</option>
                </select>
                <textarea id="icBio" placeholder="ПОЛНАЯ АВТОБИОГРАФИЯ (от 150 символов)..." class="input-mvd h-32" required></textarea>
                <button type="submit" class="w-full bg-blue-700 py-4 font-black uppercase text-xs tracking-widest rounded hover:bg-blue-600 transition shadow-lg shadow-blue-900/20">Завести дело в базе</button>
            </form>
        </div>
    </div>

    <!-- Основной контент -->
    <main id="mainContent" class="hidden container mx-auto px-4 -mt-10 relative z-20 pb-20 grid lg:grid-cols-3 gap-8">
        <div class="lg:col-span-1">
            <div class="mvd-card p-6 sticky top-24 shadow-2xl">
                <div class="flex items-center gap-4 mb-6 border-b border-gray-900 pb-4">
                    <div id="userAvatar" class="w-12 h-12 bg-blue-900 rounded-full border border-blue-600 overflow-hidden shadow-inner"></div>
                    <div>
                        <h3 id="profileName" class="font-black italic text-white uppercase leading-none text-sm tracking-tighter">...</h3>
                        <p id="profileRank" class="text-blue-500 text-[9px] mt-1 font-bold uppercase tracking-widest"></p>
                    </div>
                </div>
                <h4 class="text-[10px] font-black text-gray-500 uppercase mb-4 tracking-widest">Подать новый рапорт</h4>
                <form id="appForm" class="space-y-3">
                    <select id="appType" class="input-mvd text-xs bg-black/50">
                        <option>Заявление на удостоверение</option>
                        <option>Рапорт на повышение</option>
                        <option>Снятие выговора</option>
                    </select>
                    <textarea id="appText" placeholder="Опишите суть обращения или прикрепите ссылки..." class="input-mvd h-24 text-xs bg-black/50"></textarea>
                    <button class="w-full bg-blue-600 text-white py-3 rounded text-[10px] font-black uppercase hover:bg-blue-500 transition shadow-lg shadow-blue-900/20 active:scale-95">Отправить рапорт</button>
                </form>
                <div class="mt-4">
                    <a href="https://github.io" class="block text-center text-[9px] text-gray-600 hover:text-blue-400 underline uppercase tracking-tighter transition">На основной сайт</a>
                </div>
            </div>
        </div>
        <div class="lg:col-span-2">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-sm font-black uppercase text-blue-500 tracking-[0.2em] italic">Архив специальных рапортов</h2>
                <div class="w-2 h-2 bg-red-600 rounded-full animate-pulse shadow-lg shadow-red-600/50"></div>
            </div>
            <div id="feed" class="space-y-4">
                <div class="text-center py-20 text-gray-800 text-xs font-bold animate-pulse uppercase tracking-[0.5em]">Ожидание сигнала ГУ МВД...</div>
            </div>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDcYntF4I5E9fBRt7a-REdIg21aaqC8cok",
            authDomain: "://firebaseapp.com",
            projectId: "osb-dps-forum-f2ba4",
            storageBucket: "osb-dps-forum-f2ba4.firebasestorage.app",
            messagingSenderId: "1005524809806",
            appId: "1:1005524809806:web:a2cac8c32decb55dc66b1f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let userData = null;

        async function login() {
            const provider = new firebase.auth.OAuthProvider('oidc.discord');
            await auth.signInWithPopup(provider);
        }

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                document.getElementById('authArea').innerHTML = `<span class="text-[9px] text-green-500 font-bold uppercase tracking-widest italic flex items-center gap-1"><div class="w-1 h-1 bg-green-500 rounded-full"></div> Онлайн</span>`;
                const doc = await db.collection('users').doc(user.uid).get();
                if (!doc.exists) {
                    document.getElementById('regModal').classList.remove('hidden');
                } else {
                    userData = doc.data();
                    showUI(user);
                }
            }
        });

        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                firstName: document.getElementById('icFirst').value,
                lastName: document.getElementById('icLast').value,
                badge: document.getElementById('icBadge').value,
                rank: document.getElementById('icRank').value,
                bio: document.getElementById('icBio').value
            };
            await db.collection('users').doc(auth.currentUser.uid).set(data);
            location.reload();
        };

        function showUI(user) {
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('profileName').innerText = `${userData.firstName} ${userData.lastName}`;
            document.getElementById('profileRank').innerText = `${userData.rank} | ${userData.badge}`;
            document.getElementById('userAvatar').innerHTML = `<img src="${user.photoURL}" class="w-full h-full object-cover">`;
        }

        document.getElementById('appForm').onsubmit = async (e) => {
            e.preventDefault();
            await db.collection('applications').add({
                author: `${userData.firstName} ${userData.lastName}`,
                badge: userData.badge,
                type: document.getElementById('appType').value,
                text: document.getElementById('appText').value,
                status: 'waiting',
                date: new Date().toLocaleString('ru-RU'),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("Ваш рапорт передан в базу данных ОСБ!");
            e.target.reset();
        };

        db.collection('applications').orderBy('timestamp', 'desc').onSnapshot(snap => {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            snap.forEach(doc => {
                const app = doc.data();
                feed.innerHTML += `
                    <div class="mvd-card p-5 border-l-2 ${app.status === 'waiting' ? 'border-yellow-600' : 'border-green-600'}">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <span class="status-badge ${app.status === 'waiting' ? 'waiting' : ''}">${app.status === 'waiting' ? 'На рассмотрении' : 'Обработано'}</span>
                                <h4 class="font-black text-sm uppercase italic mt-2 tracking-tighter">${app.author} <span class="text-[10px] text-gray-600 font-normal">#${app.badge}</span></h4>
                                <p class="text-blue-500 text-[10px] font-bold uppercase tracking-widest mt-1">${app.type}</p>
                            </div>
                            <span class="text-[9px] text-gray-700">${app.date}</span>
                        </div>
                        <div class="p-3 bg-black/40 rounded text-xs text-gray-400 italic font-light border border-white/5">
                            "${app.text}"
                        </div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
