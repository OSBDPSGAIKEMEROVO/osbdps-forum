<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ФОРУМ ОСБ ДПС — КУЗБАСС</title>
    
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        :root { --blue: #007bff; --bg: #0a0c10; --card: #12161c; }
        body { background: var(--bg); color: #ccc; font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        header { 
            width: 100%; height: 300px; 
            background: url('i.png') no-repeat center center; background-size: cover; 
            border-bottom: 2px solid var(--blue); box-shadow: 0 0 15px rgba(0, 123, 255, 0.4);
        }

        .container { max-width: 1000px; margin: -30px auto 50px; padding: 0 20px; }
        .card { background: var(--card); border: 1px solid #232a35; border-radius: 8px; padding: 25px; margin-bottom: 20px; }
        
        .btn { 
            background: transparent; border: 1px solid var(--blue); color: var(--blue); 
            padding: 8px 20px; cursor: pointer; text-transform: uppercase; font-weight: bold; border-radius: 4px; transition: 0.3s;
        }
        .btn:hover { background: var(--blue); color: #fff; }
        .btn-admin { border-color: #ff4444; color: #ff4444; margin: 5px; }

        input { background: #000; border: 1px solid #333; color: #fff; padding: 10px; margin: 10px 0; width: 250px; border-radius: 4px; }
        
        /* СТАТУСЫ */
        .status-box { font-size: 40px; font-weight: 900; text-transform: uppercase; letter-spacing: 5px; margin: 20px 0; }
        .st-pending { color: #ffffff; text-shadow: 0 0 10px #fff; }
        .st-review { color: #ffff00; text-shadow: 0 0 10px #ffff00; }
        .st-approved { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
        .st-rejected { color: #ff0000; text-shadow: 0 0 10px #ff0000; }

        #auth-screen, #status-screen, #main-forum, #admin-panel { display: none; text-align: center; }
        .active { display: block !important; }

        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #222; }
    </style>
</head>
<body>

<header></header>

<div class="container">
    <!-- ВХОД -->
    <div id="auth-screen" class="card active">
        <h2>АВТОРИЗАЦИЯ ОСБ</h2>
        <input type="email" id="email" placeholder="Email"><br>
        <input type="password" id="password" placeholder="Пароль"><br>
        <button class="btn" onclick="login()">Вход</button>
        <button class="btn" onclick="register()">Регистрация</button>
    </div>

    <!-- ЭКРАН СТАТУСА -->
    <div id="status-screen" class="card">
        <h2 id="status-title">ВАША ЗАЯВКА:</h2>
        <div id="status-text" class="status-box">ЗАГРУЗКА...</div>
        <p id="status-desc" style="color: #666;"></p>
        <button class="btn" onclick="logout()">Выход</button>
    </div>

    <!-- ГЛАВНЫЙ ФОРУМ -->
    <div id="main-forum">
        <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
            <h3 id="user-info">Сотрудник ОСБ</h3>
            <div>
                <button id="admin-btn" class="btn btn-admin" style="display:none;" onclick="showAdmin()">АДМИН-ПАНЕЛЬ</button>
                <button class="btn" onclick="logout()">Выход</button>
            </div>
        </div>
        <div class="card"><h2>РАЗДЕЛЫ ФОРУМА В РАЗРАБОТКЕ</h2></div>
    </div>

    <!-- АДМИН ПАНЕЛЬ -->
    <div id="admin-panel" class="card">
        <h2 style="color: #ff4444;">ПРОВЕРКА ЗАЯВОК</h2>
        <div id="users-list"></div>
        <button class="btn" onclick="location.reload()" style="margin-top: 20px;">Назад</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAwTtQdXUORxEMwxYb5-6UQxD0ilYOaevg",
        authDomain: "://firebaseapp.com",
        projectId: "osbforum",
        storageBucket: "osbforum.firebasestorage.app",
        messagingSenderId: "126019468718",
        appId: "1:126019468718:web:8a729fc6d5df476f7d1c3f"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        if (user) checkUser(user);
        else showPage('auth-screen');
    });

    function checkUser(user) {
        db.collection('users').doc(user.uid).onSnapshot(doc => {
            if (!doc.exists) return;
            const data = doc.data();
            
            if (data.status === 'approved') {
                document.getElementById('user-info').innerText = data.name;
                if (data.role === 'admin') document.getElementById('admin-btn').style.display = 'inline-block';
                showPage('main-forum');
            } else {
                updateStatusUI(data.status);
                showPage('status-screen');
            }
        });
    }

    function updateStatusUI(status) {
        const s = document.getElementById('status-text');
        const d = document.getElementById('status-desc');
        s.className = 'status-box';
        
        if (status === 'pending') {
            s.innerText = 'ОЖИДАНИЕ'; s.classList.add('st-pending');
            d.innerText = 'Ваш рапорт находится в очереди на рассмотрение.';
        } else if (status === 'review') {
            s.innerText = 'НА ПРОВЕРКЕ'; s.classList.add('st-review');
            d.innerText = 'Руководство батальона изучает ваши данные.';
        } else if (status === 'rejected') {
            s.innerText = 'ОТКАЗАНО'; s.classList.add('st-rejected');
            d.innerText = 'Ваш рапорт был отклонен. Попробуйте позже.';
        }
    }

    function showAdmin() {
        showPage('admin-panel');
        db.collection('users').where('status', '!=', 'approved').get().then(snap => {
            const list = document.getElementById('users-list');
            list.innerHTML = '';
            snap.forEach(doc => {
                const u = doc.data();
                list.innerHTML += `<div class="user-row">
                    <span>${u.name} (${u.status})</span>
                    <div>
                        <button class="btn btn-admin" onclick="setStatus('${doc.id}', 'review')">Проверка</button>
                        <button class="btn" style="border-color:#0f0;color:#0f0" onclick="setStatus('${doc.id}', 'approved')">Принять</button>
                        <button class="btn btn-admin" onclick="setStatus('${doc.id}', 'rejected')">Отказ</button>
                    </div>
                </div>`;
            });
        });
    }

    function setStatus(uid, status) {
        db.collection('users').doc(uid).update({ status: status }).then(() => showAdmin());
    }

    function showPage(id) {
        document.querySelectorAll('.container > div').forEach(div => div.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function register() {
        const name = prompt("Введите ФИО и Позывной:");
        if (!name) return;
        auth.createUserWithEmailAndPassword(email.value, password.value).then(res => {
            db.collection('users').doc(res.user.uid).set({
                name: name, email: email.value, status: 'pending', role: 'user'
            });
        });
    }
    function login() { auth.signInWithEmailAndPassword(email.value, password.value); }
    function logout() { auth.signOut(); location.reload(); }
</script>
</body>
</html>
