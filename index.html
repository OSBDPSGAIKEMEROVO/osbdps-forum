<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEMEROVO RP | Система ОСБ ДПС</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d0d0d; color: #ffffff; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #141414; border: 1px solid #1f1f1f; border-radius: 12px; }
        .card { background-color: #141414; border: 1px solid #1f1f1f; border-radius: 12px; transition: 0.3s; }
        .nav-btn { color: #9ca3af; width: 100%; text-align: left; padding: 12px; border-radius: 8px; font-weight: bold; transition: 0.2s; font-size: 14px; }
        .nav-btn:hover, .nav-btn.active { background: #3b82f6; color: white; }
        .admin-controls { display: none !important; }
        body.is-admin .admin-controls { display: flex !important; }
        input, textarea { background: #0a0a0a !important; border: 1px solid #333 !important; color: white !important; outline: none; }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="max-w-6xl mx-auto flex justify-between items-center mb-10">
        <h1 class="text-4xl font-black italic uppercase tracking-tighter">Форум</h1>
        <div id="userBox">
            <button onclick="login()" class="bg-[#5865F2] px-5 py-2 rounded-lg font-bold flex items-center gap-2 text-sm">
                <img src="images.jpg" class="w-5 h-5 rounded-full"> Войти
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto grid md:grid-cols-12 gap-8">
        <aside class="md:col-span-3 space-y-4">
            <div class="sidebar p-5">
                <h3 class="text-blue-500 font-black uppercase text-[10px] mb-6 tracking-widest italic">KEMEROVO RP</h3>
                <button onclick="switchTab('news')" id="btn-news" class="nav-btn active">★ Главное</button>
                <button onclick="protectedAction('forum')" id="btn-forum" class="nav-btn mt-2">🏛 База МВД / ОСБ</button>
            </div>
        </aside>

        <section class="md:col-span-9 space-y-6">
            <div id="tab-news">
                <div class="card p-8">
                    <h3 class="text-2xl font-black italic text-blue-600 uppercase mb-4">Система авторизации обновлена</h3>
                    <p class="text-gray-400 text-sm leading-relaxed">Доступ к рапортам сотрудников ОСБ осуществляется через синхронизацию с Discord. Авторизуйтесь, чтобы увидеть закрытые разделы.</p>
                </div>
            </div>

            <div id="tab-forum" class="hidden space-y-6">
                <div class="flex justify-between items-center border-b border-gray-800 pb-6">
                    <h2 class="text-xl font-black italic uppercase">Реестр спецбатальона</h2>
                    <button onclick="document.getElementById('postModal').classList.remove('hidden')" class="bg-blue-600 text-white px-6 py-2 rounded text-[10px] font-black uppercase">Подать рапорт</button>
                </div>
                <div id="feed" class="space-y-6"></div>
            </div>
        </section>
    </main>

    <!-- Модалки -->
    <div id="regModal" class="hidden fixed inset-0 bg-black/98 z-50 flex items-center justify-center p-6">
        <div class="sidebar max-w-xl w-full p-10">
            <h2 class="text-2xl font-black italic uppercase text-blue-600 mb-6">Создать личное дело</h2>
            <form id="regForm" class="space-y-4">
                <input type="text" id="rFio" placeholder="ФИО персонажа (RP)" class="w-full p-4 rounded text-sm" required>
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="rRank" placeholder="Звание" class="w-full p-4 rounded text-sm" required>
                    <input type="text" id="rPost" placeholder="Должность" class="w-full p-4 rounded text-sm" required>
                </div>
                <textarea id="rBio" placeholder="Автобиография..." class="w-full p-4 rounded h-40 text-sm" required></textarea>
                <button type="submit" class="w-full bg-blue-700 py-4 font-black uppercase text-xs rounded">Внести в реестр</button>
            </form>
        </div>
    </div>

    <div id="postModal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-6">
        <div class="sidebar max-w-lg w-full p-8">
            <textarea id="pText" placeholder="Суть рапорта..." class="w-full p-4 rounded h-32 text-sm mb-4"></textarea>
            <button onclick="sendPost()" class="w-full bg-blue-600 py-3 font-black uppercase text-[10px] rounded">Отправить</button>
        </div>
    </div>

    <!-- Исправленные скрипты Firebase -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDcYntF4I5E9fBRt7a-REdIg21aaqC8cok",
            authDomain: "osb-dps-forum-f2ba4.firebaseapp.com",
            projectId: "osb-dps-forum-f2ba4",
            storageBucket: "osb-dps-forum-f2ba4.firebasestorage.app",
            messagingSenderId: "1005524809806",
            appId: "1:1005524809806:web:a2cac8c32decb55dc66b1f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let userData = null;
        const GUILD_ID = "1489059891120443585"; 
        const ADMIN_ROLES = ["1497015884873728250", "1497020406597423184"]; 

        async function login() {
            const provider = new firebase.auth.OAuthProvider('oidc.discord');
            provider.addScope('guilds');
            provider.addScope('guilds.members.read');
            const result = await auth.signInWithPopup(provider);
            checkRoles(result.credential.accessToken);
        }

        async function checkRoles(token) {
            try {
                const res = await fetch(`https://discord.com{GUILD_ID}/member`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const member = await res.json();
                if (member.roles && member.roles.some(r => ADMIN_ROLES.includes(r))) {
                    document.body.classList.add('is-admin');
                }
            } catch (e) { console.error(e); }
        }

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                document.getElementById('userBox').innerHTML = `<div class="flex items-center gap-3"><img src="${user.photoURL}" class="w-8 h-8 rounded-full border border-blue-600"><span class="text-xs font-bold uppercase italic">${user.displayName}</span></div>`;
                const doc = await db.collection('users').doc(user.uid).get();
                if (!doc.exists) document.getElementById('regModal').classList.remove('hidden');
                else userData = doc.data();
            }
        });

        function switchTab(t) {
            document.getElementById('tab-news').classList.add('hidden');
            document.getElementById('tab-forum').classList.add('hidden');
            document.getElementById('tab-'+t).classList.remove('hidden');
            if(t === 'forum') loadFeed();
        }

        function protectedAction(t) {
            if(!auth.currentUser) alert("Требуется авторизация!");
            else switchTab(t);
        }

        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            await db.collection('users').doc(auth.currentUser.uid).set({
                fio: document.getElementById('rFio').value,
                rank: document.getElementById('rRank').value,
                post: document.getElementById('rPost').value,
                bio: document.getElementById('rBio').value
            });
            location.reload();
        };

        async function sendPost() {
            await db.collection('applications').add({
                author: userData.fio,
                rank: userData.rank,
                text: document.getElementById('pText').value,
                status: 'waiting',
                date: new Date().toLocaleString(),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            document.getElementById('postModal').classList.add('hidden');
        }

        function loadFeed() {
            db.collection('applications').orderBy('timestamp', 'desc').onSnapshot(snap => {
                const feed = document.getElementById('feed');
                feed.innerHTML = '';
                snap.forEach(doc => {
                    const post = doc.data();
                    const id = doc.id;
                    feed.innerHTML += `
                        <div class="card p-6 border-l-4 ${post.status === 'waiting' ? 'border-yellow-600' : 'border-green-600'}">
                            <div class="flex justify-between mb-4">
                                <span class="text-blue-500 font-black uppercase text-[10px] tracking-widest">${post.author} [${post.rank}]</span>
                                <span class="text-[9px] text-gray-700">${post.date}</span>
                            </div>
                            <p class="text-gray-400 text-sm mb-6">"${post.text}"</p>
                            <div class="admin-controls gap-2 mb-6">
                                <button onclick="setStatus('${id}', 'accepted')" class="bg-green-900/20 text-green-500 border border-green-900 px-4 py-1 rounded text-[9px] font-bold">ОДОБРИТЬ</button>
                                <button onclick="setStatus('${id}', 'denied')" class="bg-red-900/20 text-red-500 border border-red-900 px-4 py-1 rounded text-[9px] font-bold">ОТКАЗАТЬ</button>
                            </div>
                            <div class="bg-black/30 p-4 rounded-lg">
                                <div id="comments-${id}" class="space-y-2 mb-4"></div>
                                <div class="flex gap-2">
                                    <input type="text" id="in-${id}" placeholder="Ответить..." class="flex-1 p-2 text-xs rounded bg-black">
                                    <button onclick="addComment('${id}')" class="bg-blue-600 px-4 rounded text-[9px] font-black">ОТВЕТ</button>
                                </div>
                            </div>
                        </div>`;
                    loadComments(id);
                });
            });
        }

        async function setStatus(id, s) { await db.collection('applications').doc(id).update({ status: s }); }

        async function addComment(id) {
            const val = document.getElementById('in-'+id).value;
            if(!val) return;
            await db.collection('applications').doc(id).collection('comments').add({
                user: userData.fio, text: val, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            document.getElementById('in-'+id).value = '';
        }

        function loadComments(id) {
            db.collection('applications').doc(id).collection('comments').orderBy('timestamp', 'asc').onSnapshot(snap => {
                const box = document.getElementById('comments-'+id);
                box.innerHTML = '';
                snap.forEach(c => {
                    const d = c.data();
                    box.innerHTML += `<div class="text-[11px] border-l border-blue-900 pl-3">
                        <span class="text-blue-500 font-bold uppercase">${d.user}:</span> <span class="text-gray-400">${d.text}</span>
                    </div>`;
                });
            });
        }
    </script>
</body>
</html>
